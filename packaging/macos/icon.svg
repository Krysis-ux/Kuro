<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Kuro</title>
  <!--
    The application icon: the Kuro mark, a rounded k whose upper arm is a dot,
    in white on a charcoal tile.

    The mark is drawn on a 100-unit grid, the same numbers as KuroGlyph in
    macos/Sources/Kuro/Views/Theme.swift and web/src/components/Logo.tsx.
    Change all three together.

    Sized in absolute units rather than left to scale, because the rasteriser
    that turns this into PNGs honours width/height.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2c" />
      <stop offset="1" stop-color="#0f0f10" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Rounded square on the macOS grid: 864 wide, inset 80, corner radius ~22.5%. -->
  <rect x="80" y="80" width="864" height="864" rx="196" ry="196" fill="url(#tile)" />
  <rect x="81" y="81" width="862" height="862" rx="195" ry="195" fill="none" stroke="url(#rim)" stroke-width="2" />

  <!-- The mark at scale 6, centred on its own bounds (x 20.5–79, y 12.5–87.5). -->
  <g transform="translate(213.5 212) scale(6)" fill="#f5f5f5" stroke="#f5f5f5">
    <path d="M28 20 V80 M42 52 L70 80" fill="none" stroke-width="15" stroke-linecap="round" />
    <circle cx="66" cy="32" r="13" stroke="none" />
  </g>
</svg>
